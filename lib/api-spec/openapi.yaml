openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CodeCraft API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: languages
    description: Programming languages
  - name: courses
    description: Course management
  - name: lessons
    description: Lesson content
  - name: progress
    description: User progress tracking
  - name: quiz
    description: Quiz and assessments
  - name: code
    description: Code execution
  - name: leaderboard
    description: Leaderboard
  - name: admin
    description: Admin operations
  - name: studyGroups
    description: Study groups, chat, and social features
  - name: wallet
    description: Coin wallet and Paystack payments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [languages]
      summary: List all programming languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /languages/{slug}/courses:
    get:
      operationId: listCoursesByLanguage
      tags: [languages]
      summary: List courses for a language
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Courses for the language
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course details with lessons
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a single lesson
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Not found

  /progress:
    get:
      operationId: getUserProgress
      tags: [progress]
      summary: Get authenticated user's progress
      responses:
        "200":
          description: User progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProgress"
        "401":
          description: Unauthorized
    post:
      operationId: markLessonComplete
      tags: [progress]
      summary: Mark a lesson as complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
        "401":
          description: Unauthorized

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [progress]
      summary: Get summary of user progress per language
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressSummary"
        "401":
          description: Unauthorized

  /quiz/course/{courseId}:
    get:
      operationId: getQuizByCourse
      tags: [quiz]
      summary: Get quiz for a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "404":
          description: Not found

  /quiz/attempts:
    post:
      operationId: submitQuizAttempt
      tags: [quiz]
      summary: Submit a solo quiz attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "201":
          description: Attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
        "401":
          description: Unauthorized

  /quiz/attempts/me:
    get:
      operationId: getMyQuizAttempts
      tags: [quiz]
      summary: Get authenticated user's quiz attempts
      responses:
        "200":
          description: List of quiz attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizAttempt"
        "401":
          description: Unauthorized

  /quiz/sessions:
    post:
      operationId: createQuizSession
      tags: [quiz]
      summary: Create a multiplayer quiz session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "401":
          description: Unauthorized

  /quiz/sessions/{code}:
    get:
      operationId: getQuizSession
      tags: [quiz]
      summary: Get a multiplayer quiz session by code
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "404":
          description: Not found

  /quiz/sessions/{code}/join:
    post:
      operationId: joinQuizSession
      tags: [quiz]
      summary: Join a multiplayer quiz session
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionInput"
      responses:
        "200":
          description: Joined session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /quiz/sessions/{code}/start:
    post:
      operationId: startQuizSession
      tags: [quiz]
      summary: Start a multiplayer quiz session (host only)
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "401":
          description: Unauthorized
        "403":
          description: Not the host
        "404":
          description: Not found

  /quiz/sessions/{code}/questions:
    get:
      operationId: getQuizSessionQuestions
      tags: [quiz]
      summary: Get the ordered competition questions for a session
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered list of questions for this competition
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionQuestion"
        "404":
          description: Not found

  /quiz/sessions/{code}/answer:
    post:
      operationId: submitSessionAnswer
      tags: [quiz]
      summary: Submit an answer in a multiplayer session
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionAnswerInput"
      responses:
        "200":
          description: Answer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "401":
          description: Unauthorized

  /code/run:
    post:
      operationId: runCode
      tags: [code]
      summary: Execute code and return output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRunInput"
      responses:
        "200":
          description: Code execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResult"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users by XP/score
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: languageSlug
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide stats (admin only)
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with stats (admin only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /users/me/username:
    get:
      operationId: getMyUsername
      tags: [studyGroups]
      summary: Get the current user's username (null if not set yet)
      responses:
        "200":
          description: Current username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameResponse"
        "401":
          description: Unauthorized
    patch:
      operationId: setMyUsername
      tags: [studyGroups]
      summary: Set or change the current user's unique username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUsernameInput"
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameResponse"
        "401":
          description: Unauthorized
        "409":
          description: Username already taken

  /users/search:
    get:
      operationId: searchUsers
      tags: [studyGroups]
      summary: Search users by username, for adding study group members
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
        "401":
          description: Unauthorized

  /study-groups:
    get:
      operationId: listStudyGroups
      tags: [studyGroups]
      summary: List study groups the current user belongs to
      responses:
        "200":
          description: My study groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createStudyGroup
      tags: [studyGroups]
      summary: Create a new study group (creator becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyGroupInput"
      responses:
        "200":
          description: Created study group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupSummary"
        "401":
          description: Unauthorized

  /study-groups/invites/pending:
    get:
      operationId: listPendingInvites
      tags: [studyGroups]
      summary: List the current user's pending group invitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingInvite"
        "401":
          description: Unauthorized

  /study-groups/invites/{membershipId}/accept:
    post:
      operationId: acceptStudyGroupInvite
      tags: [studyGroups]
      summary: Accept a pending group invitation
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupMember"
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

  /study-groups/invites/{membershipId}/decline:
    post:
      operationId: declineStudyGroupInvite
      tags: [studyGroups]
      summary: Decline a pending group invitation
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupMember"
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

  /study-groups/notifications:
    get:
      operationId: listNotifications
      tags: [studyGroups]
      summary: List the current user's recent notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupNotification"
        "401":
          description: Unauthorized

  /study-groups/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [studyGroups]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification updated
        "401":
          description: Unauthorized

  /study-groups/{groupId}:
    get:
      operationId: getStudyGroup
      tags: [studyGroups]
      summary: Get study group details, members, and my role
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a member
        "404":
          description: Not found
    patch:
      operationId: updateStudyGroup
      tags: [studyGroups]
      summary: Update study group name, description, or avatar (owner only)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudyGroupInput"
      responses:
        "200":
          description: Updated study group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupSummary"
        "401":
          description: Unauthorized
        "403":
          description: Owner only
    delete:
      operationId: deleteStudyGroup
      tags: [studyGroups]
      summary: Delete a study group (owner only)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Owner only

  /study-groups/{groupId}/invite-codes:
    post:
      operationId: generateInviteCode
      tags: [studyGroups]
      summary: Generate a new single-use invite code for this group (owner/admin only)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Newly generated invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeOut"
        "401":
          description: Unauthorized
        "403":
          description: Owner/admin only

  /study-groups/join/{code}:
    get:
      operationId: previewGroupByCode
      tags: [studyGroups]
      summary: Preview a study group by an unused invite code before joining
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCodePreview"
        "401":
          description: Unauthorized
        "404":
          description: Invalid or already-used invite code
    post:
      operationId: joinGroupByCode
      tags: [studyGroups]
      summary: Join a study group immediately by redeeming a single-use invite code
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined study group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupSummary"
        "401":
          description: Unauthorized
        "404":
          description: Invalid or already-used invite code
        "409":
          description: Already a member

  /study-groups/{groupId}/invites:
    post:
      operationId: inviteStudyGroupMembers
      tags: [studyGroups]
      summary: Invite one or more users by username (owner/admin only)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMembersInput"
      responses:
        "200":
          description: Invitations sent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupMember"
        "401":
          description: Unauthorized
        "403":
          description: Owner/admin only

  /study-groups/{groupId}/members/{userId}:
    patch:
      operationId: updateStudyGroupMemberRole
      tags: [studyGroups]
      summary: Promote/demote a member's role (owner only)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupMember"
        "401":
          description: Unauthorized
        "403":
          description: Owner only
    delete:
      operationId: removeStudyGroupMember
      tags: [studyGroups]
      summary: Remove a member (owner/admin), or leave the group yourself
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "401":
          description: Unauthorized
        "403":
          description: Not allowed

  /study-groups/{groupId}/messages:
    get:
      operationId: listStudyGroupMessages
      tags: [studyGroups]
      summary: List messages in a study group (paginated, newest last)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: before
          schema:
            type: integer
          description: Return messages with id less than this (pagination cursor)
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupMessageOut"
        "401":
          description: Unauthorized
        "403":
          description: Not a member
    post:
      operationId: createStudyGroupMessage
      tags: [studyGroups]
      summary: Send a message to a study group
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyGroupMessageInput"
      responses:
        "200":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupMessageOut"
        "401":
          description: Unauthorized
        "403":
          description: Not a member

  /study-groups/{groupId}/messages/{messageId}:
    delete:
      operationId: deleteStudyGroupMessage
      tags: [studyGroups]
      summary: Delete your own message
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: messageId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Not your message

  /study-groups/{groupId}/messages/{messageId}/reactions:
    post:
      operationId: toggleStudyGroupMessageReaction
      tags: [studyGroups]
      summary: Toggle an emoji reaction on a message (adds if absent, removes if present)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: messageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionInput"
      responses:
        "200":
          description: Updated reactions for the message
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyGroupMessageReaction"
        "401":
          description: Unauthorized
        "403":
          description: Not a member

  /storage/uploads/request-url:
    post:
      operationId: requestStudyGroupUploadUrl
      tags: [studyGroups]
      summary: Request a presigned upload URL for a study group avatar or chat attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "401":
          description: Unauthorized

  /wallet/config:
    get:
      operationId: getWalletConfig
      tags: [wallet]
      summary: Check whether Paystack is configured
      responses:
        "200":
          description: Wallet config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletConfig"

  /wallet/packages:
    get:
      operationId: listCoinPackages
      tags: [wallet]
      summary: List purchasable coin packages
      responses:
        "200":
          description: Coin packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinPackage"

  /wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [wallet]
      summary: Get the authenticated user's coin balance
      responses:
        "200":
          description: Coin balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "401":
          description: Unauthorized

  /wallet/transactions:
    get:
      operationId: getMyWalletTransactions
      tags: [wallet]
      summary: Get the authenticated user's wallet transaction history
      responses:
        "200":
          description: Wallet transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "401":
          description: Unauthorized

  /wallet/unlocked:
    get:
      operationId: getMyUnlockedContent
      tags: [wallet]
      summary: List premium content the authenticated user has unlocked
      responses:
        "200":
          description: Unlocked content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentUnlock"
        "401":
          description: Unauthorized

  /wallet/paystack/initialize:
    post:
      operationId: initializeCoinPurchase
      tags: [wallet]
      summary: Initialize a Paystack transaction for a coin package purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializePurchaseInput"
      responses:
        "200":
          description: Paystack authorization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializePurchaseResponse"
        "400":
          description: Invalid package
        "401":
          description: Unauthorized
        "503":
          description: Paystack not configured

  /wallet/paystack/verify/{reference}:
    get:
      operationId: verifyCoinPurchase
      tags: [wallet]
      summary: Verify a Paystack transaction and credit coins if successful
      parameters:
        - in: path
          name: reference
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPurchaseResponse"
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found
        "503":
          description: Paystack not configured

  /wallet/unlock:
    post:
      operationId: unlockPremiumContent
      tags: [wallet]
      summary: Spend coins to unlock a premium lesson or quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockContentInput"
      responses:
        "200":
          description: Content unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockContentResponse"
        "400":
          description: Not premium content
        "401":
          description: Unauthorized
        "402":
          description: Not enough coins
        "404":
          description: Content not found

  /admin/wallet/stats:
    get:
      operationId: getAdminWalletStats
      tags: [admin]
      summary: Get wallet revenue stats (admin only)
      responses:
        "200":
          description: Wallet stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletStats"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/wallet/transactions:
    get:
      operationId: listAdminWalletTransactions
      tags: [admin]
      summary: List/search/filter wallet transactions (admin only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: ["string", "null"]
        - in: query
          name: search
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletTransactionList"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/wallet/transactions/export:
    get:
      operationId: exportAdminWalletTransactions
      tags: [admin]
      summary: Export all wallet transactions as CSV (admin only)
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/wallet/adjust:
    post:
      operationId: adjustUserCoins
      tags: [admin]
      summary: Manually credit or debit a user's coin balance (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCoinsInput"
      responses:
        "200":
          description: New balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustCoinsResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

