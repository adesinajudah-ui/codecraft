kind = "mobile"
previewPath = "/mobile/"
title = "CodeCraft Mobile"
version = "1.0.0"
id = "artifacts/codecraft-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20020

[services.development]
run = "pnpm --filter @workspace/codecraft-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codecraft-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/codecraft-mobile", "run", "serve" ]

[services.env]
PORT = "20020"
BASE_PATH = "/mobile/"
