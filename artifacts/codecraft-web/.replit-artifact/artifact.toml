kind = "web"
previewPath = "/"
title = "CodeCraft"
version = "1.0.0"
id = "artifacts/codecraft-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26264

[services.development]
run = "pnpm --filter @workspace/codecraft-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codecraft-web", "run", "build" ]
publicDir = "artifacts/codecraft-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26264"
BASE_PATH = "/"
